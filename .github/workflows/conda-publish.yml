# Builds the Conda package with Rattler and publishes it to Anaconda.org.
# Manual runs build only unless the publish input is explicitly enabled.

name: Publish Conda package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the built package to Anaconda.org
        required: true
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Conda package
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          recipe-path: recipe/recipe.yaml
          build-args: -c conda-forge
          upload-artifact: false

      - name: Publish to Anaconda.org
        if: github.event_name == 'push' || inputs.publish
        env:
          ANACONDA_API_KEY: ${{ secrets.ANACONDA_API_TOKEN || secrets.ANACONDA_API_KEY }}
        run: |
          for pkg in $(find output -type f \( -name "*.conda" -o -name "*.tar.bz2" \)); do
            rattler-build upload anaconda -o LSDOlab "${pkg}"
          done
